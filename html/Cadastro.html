<h1>Cadastro de Sofredor</h1>

<p>
    Antes de entrar na Central do Sofrimento, precisamos de algumas informações.
</p>

<form action="main.html">

    <label>Nome:</label>
    <input type="text" required>

    <br><br>

    <label>Idade:</label>
    <input type="number" required>

    <br><br>

    <label>Quanto você estudou hoje?</label>

    <select required>
        <option value="">Selecione uma opção</option>
        <option>Não estudei</option>
        <option>1 hora</option>
        <option>3 horas</option>
        <option>5 horas</option>
        <option>Perdi minha alma</option>
    </select>

    <br><br>

    <label>Senha:</label>
    <input type="password" required>

    <br><br>

    <input type="submit" value="Cadastrar">

</form>
